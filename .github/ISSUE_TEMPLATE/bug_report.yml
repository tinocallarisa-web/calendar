name: Bug Report
description: Report a bug in Calendar by TCViz
labels: ["bug"]
body:
  - type: dropdown
    id: tier
    attributes:
      label: License Tier
      options: ["Free", "Pro (trial)", "Pro (paid)"]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Visual Version
      placeholder: "e.g. 1.0.0.0"
    validations:
      required: true
  - type: dropdown
    id: env
    attributes:
      label: Environment
      options: ["Power BI Desktop", "Power BI Service", "Both"]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Additional Notes (screenshots, data shape, etc.)
