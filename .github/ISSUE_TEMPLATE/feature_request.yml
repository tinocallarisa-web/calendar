name: Feature Request
description: Suggest a new feature or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the problem, not the solution
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      options: ["Calendar views", "Events", "Measures/Heatmap", "Filtering/Interaction", "Fiscal calendar", "Accessibility", "Performance", "Other"]
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
  - type: textarea
    id: workaround
    attributes:
      label: Current Workaround (if any)
